; --- EQUIPMENT & DYE ---
Repair All Gear=모든 장비 수리
Restores durability to 100% on all equipped weapons and armor.=착용 중인 모든 무기와 방어구의 내구도를 100%로 복구합니다.
No equipped gear to repair=수리할 착용 장비가 없습니다
Max Refine All (+10)=모두 최대 제련 (+10)
Sets all equipped gear to refinement level +10.=착용 중인 모든 장비의 제련 레벨을 +10으로 설정합니다.
No equipped gear to refine=제련할 착용 장비가 없습니다
Unlock All Sockets=모든 소켓 해제
Opens all 5 abyss sockets on all equipped weapons and armor.=착용 중인 모든 무기와 방어구의 심연 소켓 5개를 모두 개방합니다.
No equipped gear found=착용 중인 장비를 찾을 수 없습니다
sockets used=개 소켓 사용 중
no sockets=소켓 없음
Refine this piece and edit its abyss-gear sockets.=이 장비를 제련하고 심연 소켓을 편집합니다.
Nothing equipped=착용 중인 장비 없음
Equip some gear first.=먼저 장비를 착용하세요.
Not equipped=착용되지 않음
This piece is no longer equipped.=이 부위는 더 이상 착용되어 있지 않습니다.
Unlock all sockets=모든 소켓 해제
Opens every socket on this piece (up to 5), then socket gears into them.=이 장비의 모든 소켓(최대 5개)을 열고 장비를 장착합니다.
All sockets unlocked=모든 소켓이 해제되었습니다
Clear all sockets=모든 소켓 비우기
Removes every abyss gear from this piece, leaving the sockets open.=이 장비의 모든 심연 장비를 제거하고 소켓을 비웁니다.
All sockets cleared=모든 소켓이 비워졌습니다
Refinement=제련 레벨
Refine this piece from 0 to 10.=이 장비를 0에서 10까지 제련합니다.
Refinement set=제련 레벨이 설정되었습니다
No sockets yet=소켓 없음
Unlock sockets above to add abyss gears.=심연 장비를 장착하려면 위의 소켓을 먼저 해제하세요.
Socket=소켓

; --- WORLD Tab ---
Game Speed=게임 속도
Speeds up or slows down the game.=게임 속도를 빠르게 하거나 느리게 조절합니다.
Speeds up or slows down the game. Unavailable right now.=게임 속도를 조절합니다. 현재 사용할 수 없습니다.
Freeze Time of Day=시간 고정
Holds the clock at the current time; the world keeps running normally.=시간을 현재 상태로 고정하며 월드는 정상 작동합니다.
Holds the clock in place. Unavailable right now.=시간을 고정합니다. 현재 사용할 수 없습니다.
Advance Time=시간 넘기기
Skips the clock forward by this many hours; time keeps flowing after.=입력한 시간만큼 시계를 앞으로 이동합니다.
Skips the clock forward. Unavailable right now.=시간을 앞으로 넘깁니다. 현재 사용할 수 없습니다.
Advanced %d hours=%d시간 건너뛰었습니다

