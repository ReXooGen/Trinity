Open Menu=메뉴 열기
Opens and closes this menu.=이 메뉴를 열고 닫습니다.
Marker Teleport=마커 순간이동
Teleport directly to the map marker / custom waypoint placed on the map.=지도에 지정한 사용자 웨이포인트로 즉시 순간이동합니다.
Fly Up=상승 비행
